<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Principal Architect @ Example Corp</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; margin: 0; color: #1f2933; }
  .ashby-job-posting-heading { padding: 24px 32px; border-bottom: 1px solid #e4e7eb; }
  .ashby-job-posting-right-pane { max-width: 720px; padding: 24px 32px; }
  .ashby-application-form-field-entry { margin: 0 0 18px; }
  .ashby-application-form-question-title { display: block; font-weight: 600; margin-bottom: 4px; }
  .ashby-application-form-required-indicator { color: #d14343; }
  .ashby-application-form-field-entry input[type=text], .ashby-application-form-field-entry input[type=email], .ashby-application-form-field-entry input[type=tel], .ashby-application-form-field-entry select, .ashby-application-form-field-entry textarea { width: 100%; max-width: 480px; padding: 6px; box-sizing: border-box; }
  .ashby-application-form-field-entry textarea { min-height: 90px; }
  .ashby-application-form-file-upload-button { margin-left: 8px; }
  .ashby-application-form-submit-button { background: #3b4bd8; color: #fff; border: 0; padding: 10px 18px; font-size: 15px; }
  .ashby-already-applied { background: #fff5d6; border: 1px solid #e8c764; padding: 16px; }
  .ashby-application-form-field-entry label.option { display: inline; font-weight: 400; margin-right: 16px; }
</style>
</head>
<body>
<div class="ashby-job-posting-heading">
  <h1>Principal Architect</h1>
  <div>Example Corp · Remote (US) · Full time</div>
</div>
<div class="ashby-job-posting-right-pane">
  <h2>Application</h2>
  <form class="ashby-application-form" action="submit" method="post" enctype="multipart/form-data" novalidate>
    <div class="ashby-application-form-section-container">
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="_systemfield_name">Name <span class="ashby-application-form-required-indicator">*</span></label>
        <input id="_systemfield_name" name="_systemfield_name" type="text" required>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="_systemfield_email">Email <span class="ashby-application-form-required-indicator">*</span></label>
        <input id="_systemfield_email" name="_systemfield_email" type="email" required>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="_systemfield_phone">Phone <span class="ashby-application-form-required-indicator">*</span></label>
        <input id="_systemfield_phone" name="_systemfield_phone" type="tel" required>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume <span class="ashby-application-form-required-indicator">*</span></label>
        <input id="_systemfield_resume" name="_systemfield_resume" type="file" accept=".pdf,.doc,.docx,.txt" required>
        <button type="button" class="ashby-application-form-file-upload-button">Upload File</button>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="3f2c9c3e-1a5b-4d7e-9f0a-2b4c6d8e0f1a">LinkedIn Profile</label>
        <input id="3f2c9c3e-1a5b-4d7e-9f0a-2b4c6d8e0f1a" name="3f2c9c3e-1a5b-4d7e-9f0a-2b4c6d8e0f1a" type="text">
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d">Current company</label>
        <input id="7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d" name="7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d" type="text">
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e">Which location are you applying for? <span class="ashby-application-form-required-indicator">*</span></label>
        <select id="b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e" name="b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e" required>
          <option value="">Select...</option>
          <option>Remote</option>
          <option>San Francisco</option>
          <option>New York</option>
        </select>
      </div>
      <div class="ashby-application-form-field-entry" role="radiogroup" aria-labelledby="relocate-title">
        <div id="relocate-title" class="ashby-application-form-question-title">Are you willing to relocate?</div>
        <label class="option"><input type="radio" name="c2d3e4f5-a6b7-4c8d-9e0f-1a2b3c4d5e6f" value="Yes"> Yes</label>
        <label class="option"><input type="radio" name="c2d3e4f5-a6b7-4c8d-9e0f-1a2b3c4d5e6f" value="No"> No</label>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="d3e4f5a6-b7c8-4d9e-0f1a-2b3c4d5e6f7a">Do you now or will you in the future require visa sponsorship? <span class="ashby-application-form-required-indicator">*</span></label>
        <select id="d3e4f5a6-b7c8-4d9e-0f1a-2b3c4d5e6f7a" name="d3e4f5a6-b7c8-4d9e-0f1a-2b3c4d5e6f7a" required>
          <option value="">Select...</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>
      <div class="ashby-application-form-field-entry">
        <label class="ashby-application-form-question-title" for="e4f5a6b7-c8d9-4e0f-1a2b-3c4d5e6f7a8b">Why are you interested in this role?</label>
        <textarea id="e4f5a6b7-c8d9-4e0f-1a2b-3c4d5e6f7a8b" name="e4f5a6b7-c8d9-4e0f-1a2b-3c4d5e6f7a8b"></textarea>
      </div>
      <!-- stub:extra-questions -->
    </div>
    <!-- stub:captcha -->
    <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
  </form>
</div>
<div style="padding:16px 32px;color:#777;font-size:12px">Powered by Ashby (stand-in page for tests)</div>
</body>
</html>
