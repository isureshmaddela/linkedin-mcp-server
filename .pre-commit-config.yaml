# .pre-commit-config.yaml
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: [--allow-multiple-documents]  # deploy/k8s manifests hold several documents each
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: debug-statements

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version: keep it equal to the ruff in uv.lock, so the hook and `uv run ruff` agree.
    rev: v0.15.12
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format

-   repo: local
    hooks:
    -   id: ty
        name: ty
        # Checks the packages listed in [tool.ty.src] (the shipped code, not the tests).
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
