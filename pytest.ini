[pytest]
testpaths = tests
# The Aira app is the top-level module auto_apply_assistant.py at the root, which the editable install does not
# map (it packages linkedin_mcp_server* and aira* only). Without this, `uv run pytest` cannot import it.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers -ra
