apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aira-web
  namespace: aira
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aira-web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aira-worker
  namespace: aira
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aira-worker }
