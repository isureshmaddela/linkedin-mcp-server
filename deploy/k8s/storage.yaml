# The data root of the one `serve --worker` pod (web.yaml): control.sqlite3 (WAL), tenants/ (one SQLite per
# candidate and per organization), secrets/ and the scheduled backups (AIRA_CLOUD_BACKUP_DIR, when set under /data).
#
# ReadWriteOnce on purpose: SQLite's WAL index is shared memory that only one machine can share, so the volume is
# mounted by one node and written by one process. Do not switch it to ReadWriteMany to add replicas. Documents live
# in object storage (AIRA_CLOUD_STORAGE=s3), not here. Snapshot this volume (or set AIRA_CLOUD_BACKUP_HOURS and copy
# the backup directory off it) and keep the master key elsewhere.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aira-data
  namespace: aira
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replace-with-a-block-storage-class
  resources:
    requests:
      storage: 100Gi
