# PLACEHOLDERS ONLY. Do not apply this file or commit real values to it. Create the real Secret from your
# secret manager (external-secrets, sealed-secrets, or `kubectl create secret generic aira-secrets --from-literal=...`).
# It is not listed in kustomization.yaml on purpose.
#
# AIRA_CLOUD_MASTER_KEY  a Fernet key wrapping every organization's data key. Losing it loses the documents.
#                        python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
apiVersion: v1
kind: Secret
metadata:
  name: aira-secrets
  namespace: aira
type: Opaque
stringData:
  AIRA_CLOUD_MASTER_KEY: "<fernet key>"
  AIRA_CLOUD_S3_ACCESS_KEY: "<object storage access key>"
  AIRA_CLOUD_S3_SECRET_KEY: "<object storage secret key>"
  STRIPE_SECRET_KEY: "<sk_live_...>"
  STRIPE_WEBHOOK_SECRET: "<whsec_...>"
  AIRA_CLOUD_MODEL_KEY: "<model provider api key>"
  AIRA_CLOUD_SMTP_URL: "smtps://user:password@smtp.example.com:465"
  # optional
  AIRA_POOLED_SERPAPI_KEY: ""
  # first start only; remove afterwards
  AIRA_CLOUD_OPERATOR_EMAIL: ""
  AIRA_CLOUD_OPERATOR_PASSWORD: ""
