# kubectl apply -k deploy/k8s
# secret.example.yaml is deliberately not listed: create the real aira-secrets Secret from your secret manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aira
resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - web.yaml
  - worker.yaml
  - tick-cronjob.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
