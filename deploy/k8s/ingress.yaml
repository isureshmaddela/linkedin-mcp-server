# TLS terminates here. The application sends Strict-Transport-Security itself on https (AIRA_CLOUD_TRUST_PROXY with
# X-Forwarded-Proto); enabling HSTS on the controller as well is harmless.
# The application accepts bodies up to 25 MB (resume and document uploads); keep the proxy limit at or above it.
#
# Access logs: some URLs are capabilities (whoever has the link has the access): an export download, an
# invitation, a public page of a business's app. The application masks them in its own log; the controller logs
# every request line in full, so a second Ingress below serves those prefixes with the access log off. If your
# controller's ConfigMap sets a custom `log-format-upstream`, log `$uri` without `$args`, or keep the default for
# everything except these prefixes as here. The application's own idle timeout is 75 seconds
# (AIRA_CLOUD_HTTP_TIMEOUT): keep the controller's `upstream-keepalive-timeout` below it (the default, 60, is).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aira
  namespace: aira
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    # A Sites build is one request that answers when the whole site is written (minutes with a large model); the
    # page also reads the run while it works and recovers if a proxy cuts the request, but keep this generous.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aira.example.com]
      secretName: aira-tls
  rules:
    - host: aira.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aira-web
                port: { name: http }
---
# Capability links: the same service, with the controller's access log off so the token in the path is not written.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aira-capability-links
  namespace: aira
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aira.example.com]
      secretName: aira-tls
  rules:
    - host: aira.example.com
      http:
        paths:
          - { path: /api/exports/download/, pathType: Prefix, backend: { service: { name: aira-web, port: { name: http } } } }
          - { path: /api/invites/, pathType: Prefix, backend: { service: { name: aira-web, port: { name: http } } } }
          - { path: /api/public/, pathType: Prefix, backend: { service: { name: aira-web, port: { name: http } } } }
          - { path: /p/, pathType: Prefix, backend: { service: { name: aira-web, port: { name: http } } } }
