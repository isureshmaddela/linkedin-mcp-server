apiVersion: apps/v1
kind: Deployment
metadata:
  name: aira-web
  namespace: aira
  labels: { app.kubernetes.io/name: aira-web, app.kubernetes.io/part-of: aira-cloud }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: aira-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aira-web, app.kubernetes.io/part-of: aira-cloud }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: registry.example.com/aira-cloud-web:1.0.0   # build: docker build -f deploy/Dockerfile.cloud --target web
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8780 }
          env:
            - { name: HOME, value: /tmp }   # the root filesystem is read-only; /tmp is an emptyDir
          envFrom:
            - configMapRef: { name: aira-config }
            - secretRef: { name: aira-secrets }
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: aira-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aira-web
  namespace: aira
  labels: { app.kubernetes.io/name: aira-web }
spec:
  selector: { app.kubernetes.io/name: aira-web }
  ports:
    - { name: http, port: 80, targetPort: http }
